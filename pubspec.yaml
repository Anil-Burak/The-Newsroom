name: gatekeeper
description: "GateKeeper - An interactive simulation of Gatekeeping Theory in mass communication."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Local Database ────────────────────────────────────────────────────────
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # ── Networking (OpenAI direct HTTP) ───────────────────────────────────────
  http: ^1.2.2

  # ── Swipe Card Mechanics ──────────────────────────────────────────────────
  appinio_swiper: ^2.1.1

  # ── Dynamic Newspaper Layouts & PDF ───────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.12.0

  # ── Image & Network ───────────────────────────────────────────────────────
  cached_network_image: ^3.3.1

  # ── Typography ────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Routing ───────────────────────────────────────────────────────────────
  go_router: ^14.2.7


  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  image: ^4.9.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "images/ikon2.png"

flutter:
  uses-material-design: true
  assets:
    - images/
